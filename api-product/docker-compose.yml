version: '3.8'
services:
  app-product:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - 3015:3000
    volumes:
      - .:/app


  pgsql-product:
    image: postgres:alpine
    ports:
      - '5435:5432'
    restart: always
    volumes:
      - ./.docker/pgsql/dbdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pguser
      POSTGRES_PASSWORD: pgpassword
  
